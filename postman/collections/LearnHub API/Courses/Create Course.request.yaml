$kind: http-request
url: "{{baseUrl}}/api/v1/courses"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: Title
      value: Complete C# & .NET Masterclass
    - type: text
      key: Description
      value: Master modern C# 13 and .NET 10 building production applications.
    - type: text
      key: InstructorId
      value: 55555555-5555-5555-5555-555555555555
    - type: text
      key: CategoryId
      value: 11111111-1111-1111-1111-111111111111
    - type: text
      key: Level
      value: Beginner
    - type: text
      key: Status
      value: Published
    - type: text
      key: PriceAmount
      value: "49.99"
    - type: text
      key: Currency
      value: USD
    - type: text
      key: IsIncludedInSubscription
      value: "true"
    - type: text
      key: RequiredSubscriptionTier
      value: Free
    - type: text
      key: LanguageCode
      value: en
    - type: text
      key: LanguageName
      value: English
    - type: text
      key: Country
      value: USA
    - type: file
      key: Thumbnail
      src: []
order: 7000
