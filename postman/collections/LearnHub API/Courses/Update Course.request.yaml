$kind: http-request
url: "{{baseUrl}}/api/v1/courses/:id"
method: PUT
pathVariables:
  id: your-course-id
body:
  type: formdata
  content:
    - type: text
      key: Title
      value: Updated Complete C# Masterclass
    - type: text
      key: Description
      value: Updated course description with new modules.
    - type: text
      key: CategoryId
      value: 11111111-1111-1111-1111-111111111111
    - type: text
      key: Level
      value: Intermediate
    - type: text
      key: Status
      value: Published
    - type: text
      key: PriceAmount
      value: "59.99"
    - type: text
      key: Currency
      value: USD
    - type: text
      key: IsIncludedInSubscription
      value: "true"
    - type: text
      key: RequiredSubscriptionTier
      value: Pro
    - type: text
      key: LanguageCode
      value: en
    - type: text
      key: LanguageName
      value: English
    - type: text
      key: Country
      value: USA
order: 8000
