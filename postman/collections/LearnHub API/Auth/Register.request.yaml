$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "John",
      "lastName": "Doe",
      "email": "instructor@learnhub.com",
      "password": "Instructor@123",
      "confirmPassword": "Instructor@123",
      "role": "Instructor",
      "phoneNumber": "+1234567890"
    }
auth:
  type: noauth
order: 1000
