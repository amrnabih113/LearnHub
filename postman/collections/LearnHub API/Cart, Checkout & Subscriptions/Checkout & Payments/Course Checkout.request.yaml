$kind: http-request
url: "{{baseUrl}}/api/v1/payments/course/checkout"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "courseId": "your-course-id",
      "successUrl": "https://localhost:7098/checkout/success",
      "cancelUrl": "https://localhost:7098/checkout/cancel"
    }
order: 1000
